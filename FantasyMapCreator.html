<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Map Creator</title>
    <script src="https://d3js.org/d3.v4.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
            height: 100vh;
        }

        #app-container {
            display: flex;
            height: 100vh;
        }

        #controls-panel {
            width: 320px;
            background: #16213e;
            padding: 15px;
            overflow-y: auto;
            border-right: 2px solid #0f3460;
        }

        #map-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f3460;
            position: relative;
        }

        #map-svg {
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.4em;
            margin-bottom: 15px;
            color: #e94560;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 1.1em;
            margin: 15px 0 10px;
            color: #53a8b6;
        }

        .control-group {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: #aaa;
        }

        input[type="number"], input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #eee;
            margin-bottom: 8px;
        }

        input[type="range"] {
            padding: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #ff6b8a;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #53a8b6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7fc8d8;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #f5b041;
            transform: translateY(-2px);
        }

        .paint-controls {
            display: flex;
            gap: 5px;
        }

        .paint-controls button {
            flex: 1;
        }

        .paint-controls button.active {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-raise {
            background: #27ae60;
            color: white;
        }

        .btn-raise:hover, .btn-raise.active {
            background: #2ecc71;
        }

        .btn-lower {
            background: #8e44ad;
            color: white;
        }

        .btn-lower:hover, .btn-lower.active {
            background: #9b59b6;
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 320px;
            right: 0;
            background: rgba(22, 33, 62, 0.95);
            padding: 10px 20px;
            font-size: 0.85em;
            color: #aaa;
            border-top: 1px solid #0f3460;
        }

        .range-value {
            float: right;
            color: #53a8b6;
        }

        /* SVG Styles */
        path, line {
            fill: none;
            stroke: black;
            stroke-linecap: round;
        }

        .field {
            stroke: none;
            fill-opacity: 1.0;
        }

        .slope {
            stroke-width: 1;
        }

        .river {
            stroke-width: 2;
        }

        .coast {
            stroke-width: 4;
        }

        .border {
            stroke-width: 5;
            stroke-dasharray: 4,4;
            stroke-linecap: butt;
        }

        text {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            color: black;
            stroke: white;
            stroke-width: 5;
            stroke-linejoin: round;
            paint-order: stroke;
        }

        text.region {
            stroke-width: 10;
            font-variant: small-caps;
        }

        #mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(22, 33, 62, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .mode-active {
            color: #2ecc71;
        }

        .mode-inactive {
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="controls-panel">
            <h1>Fantasy Map Creator</h1>

            <div class="control-group">
                <h2>Generation</h2>
                <button class="btn-primary" onclick="generateNewMap()">Generate Volcanic Island</button>
                <button class="btn-secondary" onclick="regenerateTerrain()">Regenerate Terrain Only</button>
            </div>

            <div class="control-group">
                <h2>Terrain Parameters</h2>
                <label>Mesh Points: <span class="range-value" id="npts-val">8192</span></label>
                <input type="range" id="npts" min="2048" max="16384" step="1024" value="8192" oninput="document.getElementById('npts-val').textContent=this.value">

                <label>Peak Height: <span class="range-value" id="peak-val">1.0</span></label>
                <input type="range" id="peak-height" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('peak-val').textContent=this.value">
            </div>

            <div class="control-group">
                <h2>A) Erosion & Cleanup</h2>
                <label>Sea Level: <span class="range-value" id="sea-val">0.4</span></label>
                <input type="range" id="sea-level" min="0.1" max="0.7" step="0.05" value="0.4" oninput="updateSeaLevel()">

                <label>Erosion Iterations: <span class="range-value" id="erosion-val">5</span></label>
                <input type="range" id="erosion-iters" min="0" max="20" value="5" oninput="document.getElementById('erosion-val').textContent=this.value">

                <label>Erosion Amount: <span class="range-value" id="erosion-amt-val">0.1</span></label>
                <input type="range" id="erosion-amount" min="0" max="0.3" step="0.01" value="0.1" oninput="document.getElementById('erosion-amt-val').textContent=this.value">

                <button class="btn-warning" onclick="runErosion()">Run Erosion</button>

                <label>Shoreline Cleanup Passes: <span class="range-value" id="cleanup-val">3</span></label>
                <input type="range" id="cleanup-iters" min="0" max="10" value="3" oninput="document.getElementById('cleanup-val').textContent=this.value">

                <button class="btn-warning" onclick="runShorelineCleanup()">Clean Shoreline</button>
            </div>

            <div class="control-group">
                <h2>B) Terrain Painting</h2>
                <div class="paint-controls">
                    <button class="btn-raise" id="btn-raise" onclick="setPaintMode('raise')">Raise</button>
                    <button class="btn-lower" id="btn-lower" onclick="setPaintMode('lower')">Lower</button>
                    <button class="btn-secondary" id="btn-none" onclick="setPaintMode('none')">Off</button>
                </div>
                <label>Brush Size: <span class="range-value" id="brush-val">0.05</span></label>
                <input type="range" id="brush-size" min="0.02" max="0.15" step="0.01" value="0.05" oninput="document.getElementById('brush-val').textContent=this.value">

                <label>Brush Strength: <span class="range-value" id="strength-val">5.0</span></label>
                <input type="range" id="brush-strength" min="0.5" max="10.0" step="0.5" value="5.0" oninput="document.getElementById('strength-val').textContent=this.value">
            </div>

            <div class="control-group">
                <h2>C) Cities & Regions</h2>
                <label>Number of Cities: <span class="range-value" id="cities-val">12</span></label>
                <input type="range" id="ncities" min="3" max="30" value="12" oninput="document.getElementById('cities-val').textContent=this.value">

                <label>Number of Territories: <span class="range-value" id="terrs-val">4</span></label>
                <input type="range" id="nterrs" min="2" max="10" value="4" oninput="document.getElementById('terrs-val').textContent=this.value">

                <button class="btn-secondary" onclick="previewCities()">Preview Cities</button>
                <button class="btn-secondary" onclick="previewTerritories()">Preview Territories</button>
                <button class="btn-primary" onclick="drawFullMap()">Draw Complete Map</button>
            </div>

            <div class="control-group">
                <h2>View Options</h2>
                <button class="btn-secondary" onclick="showHeightmap()">Show Heightmap</button>
                <button class="btn-secondary" onclick="showTerrain()">Show Terrain</button>
                <button class="btn-secondary" onclick="showCityValue()">Show City Value</button>

                <div id="cityvalue-controls" style="display: none; margin-top: 10px;">
                    <label>Number of Cities: <span class="range-value" id="cityvalue-n-val">1</span></label>
                    <input type="range" id="cityvalue-n" min="0" max="30" value="1" oninput="updateCityValueView()">
                </div>
            </div>

            <div class="control-group">
                <h2>Export</h2>
                <button class="btn-primary" onclick="downloadSVG()">Download SVG</button>
            </div>
        </div>

        <div id="map-container">
            <svg id="map-svg"></svg>
            <div id="mode-indicator">
                Paint Mode: <span id="paint-mode-text" class="mode-inactive">Off</span>
            </div>
        </div>
    </div>

    <div class="status-bar" id="status-bar">Ready - Click "Generate Volcanic Island" to begin</div>

    <script>
    // ============================================
    // PRIORITY QUEUE IMPLEMENTATION
    // ============================================
    var PriorityQueue = (function() {
        function PriorityQueue(options) {
            this.comparator = options.comparator || function(a, b) { return a - b; };
            this.data = [];
            this.length = 0;
        }

        PriorityQueue.prototype.queue = function(value) {
            this.data.push(value);
            this.length++;
            this._bubbleUp(this.data.length - 1);
        };

        PriorityQueue.prototype.dequeue = function() {
            if (!this.length) throw 'Empty queue';
            var ret = this.data[0];
            var last = this.data.pop();
            this.length--;
            if (this.data.length > 0) {
                this.data[0] = last;
                this._bubbleDown(0);
            }
            return ret;
        };

        PriorityQueue.prototype._bubbleUp = function(pos) {
            while (pos > 0) {
                var parent = (pos - 1) >>> 1;
                if (this.comparator(this.data[pos], this.data[parent]) < 0) {
                    var x = this.data[parent];
                    this.data[parent] = this.data[pos];
                    this.data[pos] = x;
                    pos = parent;
                } else {
                    break;
                }
            }
        };

        PriorityQueue.prototype._bubbleDown = function(pos) {
            var last = this.data.length - 1;
            while (true) {
                var left = (pos << 1) + 1;
                var right = left + 1;
                var minIndex = pos;
                if (left <= last && this.comparator(this.data[left], this.data[minIndex]) < 0) {
                    minIndex = left;
                }
                if (right <= last && this.comparator(this.data[right], this.data[minIndex]) < 0) {
                    minIndex = right;
                }
                if (minIndex !== pos) {
                    var x = this.data[minIndex];
                    this.data[minIndex] = this.data[pos];
                    this.data[pos] = x;
                    pos = minIndex;
                } else {
                    break;
                }
            }
        };

        return PriorityQueue;
    })();

    // ============================================
    // LANGUAGE GENERATION
    // ============================================
    function shuffled(list) {
        var newlist = list.slice();
        for (var i = list.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * i);
            var tmp = newlist[i];
            newlist[i] = newlist[j];
            newlist[j] = tmp;
        }
        return newlist;
    }

    function choose(list, exponent) {
        exponent = exponent || 1;
        return list[Math.floor(Math.pow(Math.random(), exponent) * list.length)];
    }

    function randrange(lo, hi) {
        if (hi == undefined) { hi = lo; lo = 0; }
        return Math.floor(Math.random() * (hi - lo)) + lo;
    }

    function capitalize(word) {
        return word[0].toUpperCase() + word.slice(1);
    }

    var defaultOrtho = {
        'sh': 'sh', 'zh': 'zh', 'ch': 'ch', 'j': 'j', 'ng': 'ng',
        'y': 'y', 'kh': 'kh', 'gh': 'gh', A: "a", E: "e", I: "i", O: "o", U: "u"
    };

    var consets = [
        { name: "Minimal", C: "ptkmnls" },
        { name: "English-ish", C: "ptkbdgmnlrsshzzhch" },
        { name: "Hawaiian-ish", C: "hklmnpw" }
    ];

    var vowsets = [
        { name: "Standard", V: "aeiou" },
        { name: "3-vowel", V: "aiu" }
    ];

    var syllstructs = ["CVC", "CV", "VC", "CVV", "CCV"];

    function makeRandomLanguage() {
        return {
            phonemes: {
                C: shuffled(choose(consets, 2).C.split('')).join(''),
                V: shuffled(choose(vowsets, 2).V.split('')).join('')
            },
            structure: choose(syllstructs),
            exponent: 2,
            minsyll: randrange(1, 3),
            maxsyll: randrange(2, 5),
            morphemes: {},
            words: {},
            names: [],
            joiner: choose(['', ' ', '-']),
            maxchar: 12,
            minchar: 4
        };
    }

    function makeSyllable(lang) {
        var syll = "";
        for (var i = 0; i < lang.structure.length; i++) {
            var ptype = lang.structure[i];
            var phonemes = lang.phonemes[ptype];
            if (phonemes) {
                syll += phonemes[Math.floor(Math.pow(Math.random(), lang.exponent) * phonemes.length)];
            }
        }
        return syll;
    }

    function makeWord(lang) {
        var nsylls = randrange(lang.minsyll, lang.maxsyll + 1);
        var w = '';
        for (var i = 0; i < nsylls; i++) {
            w += makeSyllable(lang);
        }
        return w;
    }

    function makeName(lang, key) {
        while (true) {
            var name = capitalize(makeWord(lang));
            if (Math.random() < 0.3) {
                name += lang.joiner + capitalize(makeWord(lang));
            }
            if (name.length >= lang.minchar && name.length <= lang.maxchar) {
                if (!lang.names.includes(name)) {
                    lang.names.push(name);
                    return name;
                }
            }
        }
    }

    // ============================================
    // TERRAIN GENERATION CORE
    // ============================================
    function runif(lo, hi) {
        return lo + Math.random() * (hi - lo);
    }

    var rnorm = (function () {
        var z2 = null;
        return function() {
            if (z2 != null) { var tmp = z2; z2 = null; return tmp; }
            var x1 = 0, x2 = 0, w = 2.0;
            while (w >= 1) {
                x1 = runif(-1, 1);
                x2 = runif(-1, 1);
                w = x1 * x1 + x2 * x2;
            }
            w = Math.sqrt(-2 * Math.log(w) / w);
            z2 = x2 * w;
            return x1 * w;
        };
    })();

    var defaultExtent = { width: 1, height: 1 };

    function generatePoints(n, extent) {
        extent = extent || defaultExtent;
        var pts = [];
        for (var i = 0; i < n; i++) {
            pts.push([(Math.random() - 0.5) * extent.width, (Math.random() - 0.5) * extent.height]);
        }
        return pts;
    }

    function centroid(pts) {
        var x = 0, y = 0;
        for (var i = 0; i < pts.length; i++) {
            x += pts[i][0];
            y += pts[i][1];
        }
        return [x/pts.length, y/pts.length];
    }

    function voronoi(pts, extent) {
        extent = extent || defaultExtent;
        var w = extent.width/2;
        var h = extent.height/2;
        return d3.voronoi().extent([[-w, -h], [w, h]])(pts);
    }

    function improvePoints(pts, n, extent) {
        n = n || 1;
        extent = extent || defaultExtent;
        for (var i = 0; i < n; i++) {
            pts = voronoi(pts, extent).polygons(pts).map(centroid);
        }
        return pts;
    }

    function generateGoodPoints(n, extent) {
        extent = extent || defaultExtent;
        var pts = generatePoints(n, extent);
        pts = pts.sort(function (a, b) { return a[0] - b[0]; });
        return improvePoints(pts, 1, extent);
    }

    function makeMesh(pts, extent) {
        extent = extent || defaultExtent;
        var vor = voronoi(pts, extent);
        var vxs = [], vxids = {}, adj = [], edges = [], tris = [];

        for (var i = 0; i < vor.edges.length; i++) {
            var e = vor.edges[i];
            if (e == undefined) continue;
            var e0 = vxids[e[0]];
            var e1 = vxids[e[1]];
            if (e0 == undefined) {
                e0 = vxs.length;
                vxids[e[0]] = e0;
                vxs.push(e[0]);
            }
            if (e1 == undefined) {
                e1 = vxs.length;
                vxids[e[1]] = e1;
                vxs.push(e[1]);
            }
            adj[e0] = adj[e0] || [];
            adj[e0].push(e1);
            adj[e1] = adj[e1] || [];
            adj[e1].push(e0);
            edges.push([e0, e1, e.left, e.right]);
            tris[e0] = tris[e0] || [];
            if (!tris[e0].includes(e.left)) tris[e0].push(e.left);
            if (e.right && !tris[e0].includes(e.right)) tris[e0].push(e.right);
            tris[e1] = tris[e1] || [];
            if (!tris[e1].includes(e.left)) tris[e1].push(e.left);
            if (e.right && !tris[e1].includes(e.right)) tris[e1].push(e.right);
        }

        var mesh = {
            pts: pts, vor: vor, vxs: vxs, adj: adj, tris: tris, edges: edges, extent: extent
        };
        mesh.map = function (f) {
            var mapped = vxs.map(f);
            mapped.mesh = mesh;
            return mapped;
        };
        return mesh;
    }

    function generateGoodMesh(n, extent) {
        extent = extent || defaultExtent;
        var pts = generateGoodPoints(n, extent);
        return makeMesh(pts, extent);
    }

    function isedge(mesh, i) {
        return (mesh.adj[i].length < 3);
    }

    function isnearedge(mesh, i) {
        var x = mesh.vxs[i][0];
        var y = mesh.vxs[i][1];
        var w = mesh.extent.width;
        var h = mesh.extent.height;
        return x < -0.45 * w || x > 0.45 * w || y < -0.45 * h || y > 0.45 * h;
    }

    function neighbours(mesh, i) {
        return mesh.adj[i].slice();
    }

    function distance(mesh, i, j) {
        var p = mesh.vxs[i];
        var q = mesh.vxs[j];
        return Math.sqrt((p[0] - q[0]) * (p[0] - q[0]) + (p[1] - q[1]) * (p[1] - q[1]));
    }

    function quantile(h, q) {
        var sortedh = h.slice().sort(d3.ascending);
        return d3.quantile(sortedh, q);
    }

    function zero(mesh) {
        var z = [];
        for (var i = 0; i < mesh.vxs.length; i++) {
            z[i] = 0;
        }
        z.mesh = mesh;
        return z;
    }

    function map(h, f) {
        var newh = h.map(f);
        newh.mesh = h.mesh;
        return newh;
    }

    function normalize(h) {
        var lo = d3.min(h);
        var hi = d3.max(h);
        return map(h, function (x) { return (x - lo) / (hi - lo); });
    }

    function peaky(h) {
        return map(normalize(h), Math.sqrt);
    }

    function add() {
        var n = arguments[0].length;
        var newvals = zero(arguments[0].mesh);
        for (var i = 0; i < n; i++) {
            for (var j = 0; j < arguments.length; j++) {
                newvals[i] += arguments[j][i];
            }
        }
        return newvals;
    }

    // Volcanic island generator - cone in center
    function volcanicCone(mesh, peakHeight) {
        peakHeight = peakHeight || 1.0;
        return mesh.map(function (x) {
            var dist = Math.sqrt(x[0] * x[0] + x[1] * x[1]);
            // Create cone that's high in center, low at edges
            return peakHeight * (1 - dist * 2.2);
        });
    }

    // Add some random mountains for variety
    function mountains(mesh, n, r) {
        r = r || 0.05;
        var mounts = [];
        for (var i = 0; i < n; i++) {
            mounts.push([mesh.extent.width * (Math.random() - 0.5), mesh.extent.height * (Math.random() - 0.5)]);
        }
        var newvals = zero(mesh);
        for (var i = 0; i < mesh.vxs.length; i++) {
            var p = mesh.vxs[i];
            for (var j = 0; j < n; j++) {
                var m = mounts[j];
                newvals[i] += Math.pow(Math.exp(-((p[0] - m[0]) * (p[0] - m[0]) + (p[1] - m[1]) * (p[1] - m[1])) / (2 * r * r)), 2);
            }
        }
        return newvals;
    }

    function relax(h) {
        var newh = zero(h.mesh);
        for (var i = 0; i < h.length; i++) {
            var nbs = neighbours(h.mesh, i);
            if (nbs.length < 3) {
                newh[i] = 0;
                continue;
            }
            newh[i] = d3.mean(nbs.map(function (j) { return h[j]; }));
        }
        return newh;
    }

    function downhill(h) {
        if (h.downhill) return h.downhill;
        var downs = [];
        for (var i = 0; i < h.length; i++) {
            if (isedge(h.mesh, i)) {
                downs[i] = -2;
                continue;
            }
            var best = -1;
            var besth = h[i];
            var nbs = neighbours(h.mesh, i);
            for (var j = 0; j < nbs.length; j++) {
                if (h[nbs[j]] < besth) {
                    besth = h[nbs[j]];
                    best = nbs[j];
                }
            }
            downs[i] = best;
        }
        h.downhill = downs;
        return downs;
    }

    function fillSinks(h, epsilon) {
        epsilon = epsilon || 1e-5;
        var infinity = 999999;
        var newh = zero(h.mesh);
        for (var i = 0; i < h.length; i++) {
            if (isnearedge(h.mesh, i)) {
                newh[i] = h[i];
            } else {
                newh[i] = infinity;
            }
        }
        while (true) {
            var changed = false;
            for (var i = 0; i < h.length; i++) {
                if (newh[i] == h[i]) continue;
                var nbs = neighbours(h.mesh, i);
                for (var j = 0; j < nbs.length; j++) {
                    if (h[i] >= newh[nbs[j]] + epsilon) {
                        newh[i] = h[i];
                        changed = true;
                        break;
                    }
                    var oh = newh[nbs[j]] + epsilon;
                    if ((newh[i] > oh) && (oh > h[i])) {
                        newh[i] = oh;
                        changed = true;
                    }
                }
            }
            if (!changed) return newh;
        }
    }

    function getFlux(h) {
        var dh = downhill(h);
        var idxs = [];
        var flux = zero(h.mesh);
        for (var i = 0; i < h.length; i++) {
            idxs[i] = i;
            flux[i] = 1/h.length;
        }
        idxs.sort(function (a, b) { return h[b] - h[a]; });
        for (var i = 0; i < h.length; i++) {
            var j = idxs[i];
            if (dh[j] >= 0) {
                flux[dh[j]] += flux[j];
            }
        }
        return flux;
    }

    function trislope(h, i) {
        var nbs = neighbours(h.mesh, i);
        if (nbs.length != 3) return [0,0];
        var p0 = h.mesh.vxs[nbs[0]];
        var p1 = h.mesh.vxs[nbs[1]];
        var p2 = h.mesh.vxs[nbs[2]];
        var x1 = p1[0] - p0[0];
        var x2 = p2[0] - p0[0];
        var y1 = p1[1] - p0[1];
        var y2 = p2[1] - p0[1];
        var det = x1 * y2 - x2 * y1;
        var h1 = h[nbs[1]] - h[nbs[0]];
        var h2 = h[nbs[2]] - h[nbs[0]];
        return [(y2 * h1 - y1 * h2) / det, (-x2 * h1 + x1 * h2) / det];
    }

    function getSlope(h) {
        var slope = zero(h.mesh);
        for (var i = 0; i < h.length; i++) {
            var s = trislope(h, i);
            slope[i] = Math.sqrt(s[0] * s[0] + s[1] * s[1]);
        }
        return slope;
    }

    function erosionRate(h) {
        var flux = getFlux(h);
        var slope = getSlope(h);
        var newh = zero(h.mesh);
        for (var i = 0; i < h.length; i++) {
            var river = Math.sqrt(flux[i]) * slope[i];
            var creep = slope[i] * slope[i];
            var total = 1000 * river + creep;
            total = total > 200 ? 200 : total;
            newh[i] = total;
        }
        return newh;
    }

    function erode(h, amount) {
        var er = erosionRate(h);
        var newh = zero(h.mesh);
        var maxr = d3.max(er);
        for (var i = 0; i < h.length; i++) {
            newh[i] = h[i] - amount * (er[i] / maxr);
        }
        return newh;
    }

    function doErosion(h, amount, n) {
        n = n || 1;
        h = fillSinks(h);
        for (var i = 0; i < n; i++) {
            h = erode(h, amount);
            h = fillSinks(h);
        }
        return h;
    }

    function setSeaLevel(h, q) {
        var newh = zero(h.mesh);
        var delta = quantile(h, q);
        for (var i = 0; i < h.length; i++) {
            newh[i] = h[i] - delta;
        }
        return newh;
    }

    function cleanCoast(h, iters) {
        for (var iter = 0; iter < iters; iter++) {
            var newh = zero(h.mesh);
            for (var i = 0; i < h.length; i++) {
                newh[i] = h[i];
                var nbs = neighbours(h.mesh, i);
                if (h[i] <= 0 || nbs.length != 3) continue;
                var count = 0;
                var best = -999999;
                for (var j = 0; j < nbs.length; j++) {
                    if (h[nbs[j]] > 0) {
                        count++;
                    } else if (h[nbs[j]] > best) {
                        best = h[nbs[j]];
                    }
                }
                if (count > 1) continue;
                newh[i] = best / 2;
            }
            h = newh;
            newh = zero(h.mesh);
            for (var i = 0; i < h.length; i++) {
                newh[i] = h[i];
                var nbs = neighbours(h.mesh, i);
                if (h[i] > 0 || nbs.length != 3) continue;
                var count = 0;
                var best = 999999;
                for (var j = 0; j < nbs.length; j++) {
                    if (h[nbs[j]] <= 0) {
                        count++;
                    } else if (h[nbs[j]] < best) {
                        best = h[nbs[j]];
                    }
                }
                if (count > 1) continue;
                newh[i] = best / 2;
            }
            h = newh;
        }
        return h;
    }

    // ============================================
    // CITIES AND TERRITORIES
    // ============================================
    function cityScore(h, cities) {
        var score = map(getFlux(h), Math.sqrt);
        for (var i = 0; i < h.length; i++) {
            if (h[i] <= 0 || isnearedge(h.mesh, i)) {
                score[i] = -999999;
                continue;
            }
            score[i] += 0.01 / (1e-9 + Math.abs(h.mesh.vxs[i][0]) - h.mesh.extent.width/2);
            score[i] += 0.01 / (1e-9 + Math.abs(h.mesh.vxs[i][1]) - h.mesh.extent.height/2);
            for (var j = 0; j < cities.length; j++) {
                score[i] -= 0.02 / (distance(h.mesh, cities[j], i) + 1e-9);
            }
        }
        return score;
    }

    function placeCity(render) {
        render.cities = render.cities || [];
        var score = cityScore(render.h, render.cities);
        var newcity = d3.scan(score, d3.descending);
        render.cities.push(newcity);
    }

    function placeCities(render) {
        var n = render.params.ncities;
        for (var i = 0; i < n; i++) {
            placeCity(render);
        }
    }

    function getTerritories(render) {
        var h = render.h;
        var cities = render.cities;
        var n = render.params.nterrs;
        if (n > render.cities.length) n = render.cities.length;
        var flux = getFlux(h);
        var terr = [];
        var queue = new PriorityQueue({comparator: function (a, b) { return a.score - b.score; }});

        function weight(u, v) {
            var horiz = distance(h.mesh, u, v);
            var vert = h[v] - h[u];
            if (vert > 0) vert /= 10;
            var diff = 1 + 0.25 * Math.pow(vert/horiz, 2);
            diff += 100 * Math.sqrt(flux[u]);
            if (h[u] <= 0) diff = 100;
            if ((h[u] > 0) != (h[v] > 0)) return 1000;
            return horiz * diff;
        }

        for (var i = 0; i < n; i++) {
            terr[cities[i]] = cities[i];
            var nbs = neighbours(h.mesh, cities[i]);
            for (var j = 0; j < nbs.length; j++) {
                queue.queue({
                    score: weight(cities[i], nbs[j]),
                    city: cities[i],
                    vx: nbs[j]
                });
            }
        }

        while (queue.length) {
            var u = queue.dequeue();
            if (terr[u.vx] != undefined) continue;
            terr[u.vx] = u.city;
            var nbs = neighbours(h.mesh, u.vx);
            for (var i = 0; i < nbs.length; i++) {
                var v = nbs[i];
                if (terr[v] != undefined) continue;
                var newdist = weight(u.vx, v);
                queue.queue({
                    score: u.score + newdist,
                    city: u.city,
                    vx: v
                });
            }
        }
        terr.mesh = h.mesh;
        return terr;
    }

    // ============================================
    // RENDERING
    // ============================================
    function contour(h, level) {
        level = level || 0;
        var edges = [];
        for (var i = 0; i < h.mesh.edges.length; i++) {
            var e = h.mesh.edges[i];
            if (e[3] == undefined) continue;
            if (isnearedge(h.mesh, e[0]) || isnearedge(h.mesh, e[1])) continue;
            if ((h[e[0]] > level && h[e[1]] <= level) ||
                (h[e[1]] > level && h[e[0]] <= level)) {
                edges.push([e[2], e[3]]);
            }
        }
        return mergeSegments(edges);
    }

    function getRivers(h, limit) {
        var dh = downhill(h);
        var flux = getFlux(h);
        var links = [];
        var above = 0;
        for (var i = 0; i < h.length; i++) {
            if (h[i] > 0) above++;
        }
        limit *= above / h.length;
        for (var i = 0; i < dh.length; i++) {
            if (isnearedge(h.mesh, i)) continue;
            if (flux[i] > limit && h[i] > 0 && dh[i] >= 0) {
                var up = h.mesh.vxs[i];
                var down = h.mesh.vxs[dh[i]];
                if (h[dh[i]] > 0) {
                    links.push([up, down]);
                } else {
                    links.push([up, [(up[0] + down[0])/2, (up[1] + down[1])/2]]);
                }
            }
        }
        return mergeSegments(links).map(relaxPath);
    }

    function getBorders(render) {
        var terr = render.terr;
        var h = render.h;
        var edges = [];
        for (var i = 0; i < terr.mesh.edges.length; i++) {
            var e = terr.mesh.edges[i];
            if (e[3] == undefined) continue;
            if (isnearedge(terr.mesh, e[0]) || isnearedge(terr.mesh, e[1])) continue;
            if (h[e[0]] < 0 || h[e[1]] < 0) continue;
            if (terr[e[0]] != terr[e[1]]) {
                edges.push([e[2], e[3]]);
            }
        }
        return mergeSegments(edges).map(relaxPath);
    }

    function mergeSegments(segs) {
        var adj = {};
        for (var i = 0; i < segs.length; i++) {
            var seg = segs[i];
            var a0 = adj[seg[0]] || [];
            var a1 = adj[seg[1]] || [];
            a0.push(seg[1]);
            a1.push(seg[0]);
            adj[seg[0]] = a0;
            adj[seg[1]] = a1;
        }
        var done = [];
        var paths = [];
        var path = null;
        while (true) {
            if (path == null) {
                for (var i = 0; i < segs.length; i++) {
                    if (done[i]) continue;
                    done[i] = true;
                    path = [segs[i][0], segs[i][1]];
                    break;
                }
                if (path == null) break;
            }
            var changed = false;
            for (var i = 0; i < segs.length; i++) {
                if (done[i]) continue;
                if (adj[path[0]].length == 2 && segs[i][0] == path[0]) {
                    path.unshift(segs[i][1]);
                } else if (adj[path[0]].length == 2 && segs[i][1] == path[0]) {
                    path.unshift(segs[i][0]);
                } else if (adj[path[path.length - 1]].length == 2 && segs[i][0] == path[path.length - 1]) {
                    path.push(segs[i][1]);
                } else if (adj[path[path.length - 1]].length == 2 && segs[i][1] == path[path.length - 1]) {
                    path.push(segs[i][0]);
                } else {
                    continue;
                }
                done[i] = true;
                changed = true;
                break;
            }
            if (!changed) {
                paths.push(path);
                path = null;
            }
        }
        return paths;
    }

    function relaxPath(path) {
        var newpath = [path[0]];
        for (var i = 1; i < path.length - 1; i++) {
            var newpt = [0.25 * path[i-1][0] + 0.5 * path[i][0] + 0.25 * path[i+1][0],
                         0.25 * path[i-1][1] + 0.5 * path[i][1] + 0.25 * path[i+1][1]];
            newpath.push(newpt);
        }
        newpath.push(path[path.length - 1]);
        return newpath;
    }

    function makeD3Path(path) {
        var p = d3.path();
        p.moveTo(1000*path[0][0], 1000*path[0][1]);
        for (var i = 1; i < path.length; i++) {
            p.lineTo(1000*path[i][0], 1000*path[i][1]);
        }
        return p.toString();
    }

    function visualizeVoronoi(svg, field, lo, hi) {
        if (hi == undefined) hi = d3.max(field) + 1e-9;
        if (lo == undefined) lo = d3.min(field) - 1e-9;
        var mappedvals = field.map(function (x) { return x > hi ? 1 : x < lo ? 0 : (x - lo) / (hi - lo); });
        var tris = svg.selectAll('path.field').data(field.mesh.tris);
        tris.enter().append('path').classed('field', true);
        tris.exit().remove();
        svg.selectAll('path.field')
            .attr('d', makeD3Path)
            .style('fill', function (d, i) {
                return d3.interpolateViridis(mappedvals[i]);
            });
    }

    function drawPaths(svg, cls, paths) {
        var pathSel = svg.selectAll('path.' + cls).data(paths);
        pathSel.enter().append('path').classed(cls, true);
        pathSel.exit().remove();
        svg.selectAll('path.' + cls).attr('d', makeD3Path);
    }

    function visualizeSlopes(svg, render) {
        var h = render.h;
        var strokes = [];
        var r = 0.25 / Math.sqrt(h.length);
        for (var i = 0; i < h.length; i++) {
            if (h[i] <= 0 || isnearedge(h.mesh, i)) continue;
            var nbs = neighbours(h.mesh, i);
            nbs.push(i);
            var s = 0, s2 = 0;
            for (var j = 0; j < nbs.length; j++) {
                var slopes = trislope(h, nbs[j]);
                s += slopes[0] / 10;
                s2 += slopes[1];
            }
            s /= nbs.length;
            s2 /= nbs.length;
            if (Math.abs(s) < runif(0.1, 0.4)) continue;
            var l = r * runif(1, 2) * (1 - 0.2 * Math.pow(Math.atan(s), 2)) * Math.exp(s2/100);
            var x = h.mesh.vxs[i][0];
            var y = h.mesh.vxs[i][1];
            if (Math.abs(l*s) > 2 * r) {
                var n = Math.floor(Math.abs(l*s/r));
                l /= n;
                if (n > 4) n = 4;
                for (var j = 0; j < n; j++) {
                    var u = rnorm() * r;
                    var v = rnorm() * r;
                    strokes.push([[x+u-l, y+v+l*s], [x+u+l, y+v-l*s]]);
                }
            } else {
                strokes.push([[x-l, y+l*s], [x+l, y-l*s]]);
            }
        }
        var lines = svg.selectAll('line.slope').data(strokes);
        lines.enter().append('line').classed('slope', true);
        lines.exit().remove();
        svg.selectAll('line.slope')
            .attr('x1', function (d) { return 1000*d[0][0]; })
            .attr('y1', function (d) { return 1000*d[0][1]; })
            .attr('x2', function (d) { return 1000*d[1][0]; })
            .attr('y2', function (d) { return 1000*d[1][1]; });
    }

    function visualizeCities(svg, render) {
        var cities = render.cities;
        var h = render.h;
        var n = render.params.nterrs;
        var circs = svg.selectAll('circle.city').data(cities);
        circs.enter().append('circle').classed('city', true);
        circs.exit().remove();
        svg.selectAll('circle.city')
            .attr('cx', function (d) { return 1000*h.mesh.vxs[d][0]; })
            .attr('cy', function (d) { return 1000*h.mesh.vxs[d][1]; })
            .attr('r', function (d, i) { return i >= n ? 4 : 10; })
            .style('fill', 'white')
            .style('stroke-width', 5)
            .style('stroke-linecap', 'round')
            .style('stroke', 'black')
            .raise();
    }

    function terrCenter(h, terr, city, landOnly) {
        var x = 0, y = 0, n = 0;
        for (var i = 0; i < terr.length; i++) {
            if (terr[i] != city) continue;
            if (landOnly && h[i] <= 0) continue;
            x += terr.mesh.vxs[i][0];
            y += terr.mesh.vxs[i][1];
            n++;
        }
        return [x/n, y/n];
    }

    function drawLabels(svg, render) {
        var params = render.params;
        var h = render.h;
        var terr = render.terr;
        var cities = render.cities;
        var nterrs = render.params.nterrs;
        var avoids = [render.rivers, render.coasts, render.borders];
        var lang = makeRandomLanguage();
        var citylabels = [];

        function penalty(label) {
            var pen = 0;
            if (label.x0 < -0.45 * h.mesh.extent.width) pen += 100;
            if (label.x1 > 0.45 * h.mesh.extent.width) pen += 100;
            if (label.y0 < -0.45 * h.mesh.extent.height) pen += 100;
            if (label.y1 > 0.45 * h.mesh.extent.height) pen += 100;
            for (var i = 0; i < citylabels.length; i++) {
                var olabel = citylabels[i];
                if (label.x0 < olabel.x1 && label.x1 > olabel.x0 &&
                    label.y0 < olabel.y1 && label.y1 > olabel.y0) {
                    pen += 100;
                }
            }
            for (var i = 0; i < cities.length; i++) {
                var c = h.mesh.vxs[cities[i]];
                if (label.x0 < c[0] && label.x1 > c[0] && label.y0 < c[1] && label.y1 > c[1]) {
                    pen += 100;
                }
            }
            return pen;
        }

        for (var i = 0; i < cities.length; i++) {
            var x = h.mesh.vxs[cities[i]][0];
            var y = h.mesh.vxs[cities[i]][1];
            var text = makeName(lang, 'city');
            var size = i < nterrs ? params.fontsizes.city : params.fontsizes.town;
            var sx = 0.65 * size/1000 * text.length;
            var sy = size/1000;
            var posslabels = [
                { x: x + 0.8 * sy, y: y + 0.3 * sy, align: 'start', x0: x + 0.7 * sy, y0: y - 0.6 * sy, x1: x + 0.7 * sy + sx, y1: y + 0.6 * sy },
                { x: x - 0.8 * sy, y: y + 0.3 * sy, align: 'end', x0: x - 0.9 * sy - sx, y0: y - 0.7 * sy, x1: x - 0.9 * sy, y1: y + 0.7 * sy },
                { x: x, y: y - 0.8 * sy, align: 'middle', x0: x - sx/2, y0: y - 1.9*sy, x1: x + sx/2, y1: y - 0.7 * sy },
                { x: x, y: y + 1.2 * sy, align: 'middle', x0: x - sx/2, y0: y + 0.1*sy, x1: x + sx/2, y1: y + 1.3*sy }
            ];
            var label = posslabels[d3.scan(posslabels, function (a, b) { return penalty(a) - penalty(b); })];
            label.text = text;
            label.size = size;
            citylabels.push(label);
        }

        var texts = svg.selectAll('text.city').data(citylabels);
        texts.enter().append('text').classed('city', true);
        texts.exit().remove();
        svg.selectAll('text.city')
            .attr('x', function (d) { return 1000*d.x; })
            .attr('y', function (d) { return 1000*d.y; })
            .style('font-size', function (d) { return d.size; })
            .style('text-anchor', function (d) { return d.align; })
            .text(function (d) { return d.text; })
            .raise();

        var reglabels = [];
        for (var i = 0; i < nterrs; i++) {
            var city = cities[i];
            var text = makeName(lang, 'region');
            var sy = params.fontsizes.region / 1000;
            var sx = 0.6 * text.length * sy;
            var lc = terrCenter(h, terr, city, true);
            var best = 0;
            var bestscore = -999999;
            for (var j = 0; j < h.length; j++) {
                var score = 0;
                var v = h.mesh.vxs[j];
                score -= 3000 * Math.sqrt((v[0] - lc[0]) * (v[0] - lc[0]) + (v[1] - lc[1]) * (v[1] - lc[1]));
                if (terr[j] != city) score -= 3000;
                if (h[j] <= 0) score -= 500;
                if (v[0] + sx/2 > 0.5 * h.mesh.extent.width) score -= 50000;
                if (v[0] - sx/2 < -0.5 * h.mesh.extent.width) score -= 50000;
                if (v[1] > 0.5 * h.mesh.extent.height) score -= 50000;
                if (v[1] - sy < -0.5 * h.mesh.extent.height) score -= 50000;
                if (score > bestscore) {
                    bestscore = score;
                    best = j;
                }
            }
            reglabels.push({ text: text, x: h.mesh.vxs[best][0], y: h.mesh.vxs[best][1], size: sy, width: sx });
        }

        texts = svg.selectAll('text.region').data(reglabels);
        texts.enter().append('text').classed('region', true);
        texts.exit().remove();
        svg.selectAll('text.region')
            .attr('x', function (d) { return 1000*d.x; })
            .attr('y', function (d) { return 1000*d.y; })
            .style('font-size', function (d) { return 1000*d.size; })
            .style('text-anchor', 'middle')
            .text(function (d) { return d.text; })
            .raise();
    }

    // ============================================
    // APPLICATION STATE
    // ============================================
    var state = {
        mesh: null,
        h: null,
        hBeforeSeaLevel: null, // Store heights before sea level adjustment
        render: null,
        paintMode: 'none',
        isPainting: false,
        currentView: 'heightmap' // Track current view: 'heightmap', 'terrain', 'cityvalue'
    };

    var svg = d3.select('#map-svg');

    function updateStatus(msg) {
        document.getElementById('status-bar').textContent = msg;
    }

    function getParams() {
        return {
            extent: defaultExtent,
            npts: parseInt(document.getElementById('npts').value),
            ncities: parseInt(document.getElementById('ncities').value),
            nterrs: parseInt(document.getElementById('nterrs').value),
            fontsizes: {
                region: 40,
                city: 25,
                town: 20
            }
        };
    }

    function resizeSVG() {
        var container = document.getElementById('map-container');
        var size = Math.min(container.clientWidth - 40, container.clientHeight - 60);
        svg.attr('width', size).attr('height', size);
    }

    // ============================================
    // MAIN FUNCTIONS
    // ============================================
    function generateNewMap() {
        updateStatus('Generating volcanic island terrain...');

        var params = getParams();
        var peakHeight = parseFloat(document.getElementById('peak-height').value);
        var seaLevel = parseFloat(document.getElementById('sea-level').value);

        // Generate mesh
        state.mesh = generateGoodMesh(params.npts, params.extent);

        // Create volcanic island terrain
        var h = volcanicCone(state.mesh, peakHeight);

        // Add some random mountains for variety
        var mounts = mountains(state.mesh, 20, 0.08);
        h = add(h, mounts);

        // Relax terrain
        for (var i = 0; i < 5; i++) {
            h = relax(h);
        }

        // Apply peaky transformation
        h = peaky(h);

        // Store the pre-sea-level heights
        state.hBeforeSeaLevel = h.slice();
        state.hBeforeSeaLevel.mesh = state.mesh;

        // Set sea level
        h = setSeaLevel(h, seaLevel);
        h = fillSinks(h);
        h = cleanCoast(h, 2);

        state.h = h;
        state.render = {
            params: params,
            h: h,
            cities: []
        };

        showHeightmap();
        updateStatus('Volcanic island generated! Use controls to refine terrain.');
    }

    function regenerateTerrain() {
        if (!state.mesh) {
            updateStatus('Please generate a map first!');
            return;
        }

        updateStatus('Regenerating terrain...');

        var peakHeight = parseFloat(document.getElementById('peak-height').value);
        var seaLevel = parseFloat(document.getElementById('sea-level').value);

        var h = volcanicCone(state.mesh, peakHeight);
        var mounts = mountains(state.mesh, 20, 0.08);
        h = add(h, mounts);

        for (var i = 0; i < 5; i++) {
            h = relax(h);
        }

        h = peaky(h);

        // Store the pre-sea-level heights
        state.hBeforeSeaLevel = h.slice();
        state.hBeforeSeaLevel.mesh = state.mesh;

        h = setSeaLevel(h, seaLevel);
        h = fillSinks(h);
        h = cleanCoast(h, 2);

        state.h = h;
        state.render.h = h;
        state.render.cities = [];

        showHeightmap();
        updateStatus('Terrain regenerated!');
    }

    function syncHBeforeSeaLevel() {
        if (!state.hBeforeSeaLevel || !state.mesh) return;
        var seaLevel = parseFloat(document.getElementById('sea-level').value);
        var delta = quantile(state.hBeforeSeaLevel, seaLevel);
        state.hBeforeSeaLevel = state.h.slice();
        state.hBeforeSeaLevel.mesh = state.mesh;
        for (var i = 0; i < state.hBeforeSeaLevel.length; i++) {
            state.hBeforeSeaLevel[i] += delta;
        }
    }

    function runErosion() {
        if (!state.h) {
            updateStatus('Please generate a map first!');
            return;
        }

        var iters = parseInt(document.getElementById('erosion-iters').value);
        var amount = parseFloat(document.getElementById('erosion-amount').value);

        updateStatus('Running ' + iters + ' erosion iterations...');

        state.h = doErosion(state.h, amount, iters);
        state.render.h = state.h;
        syncHBeforeSeaLevel();

        refreshCurrentView();
        updateStatus('Erosion complete!');
    }

    function runShorelineCleanup() {
        if (!state.h) {
            updateStatus('Please generate a map first!');
            return;
        }

        var iters = parseInt(document.getElementById('cleanup-iters').value);

        updateStatus('Cleaning shoreline (' + iters + ' passes)...');

        state.h = cleanCoast(state.h, iters);
        state.render.h = state.h;
        syncHBeforeSeaLevel();

        refreshCurrentView();
        updateStatus('Shoreline cleaned!');
    }

    function showHeightmap() {
        if (!state.h) return;

        state.currentView = 'heightmap';
        document.getElementById('cityvalue-controls').style.display = 'none';

        svg.selectAll('*').remove();
        visualizeVoronoi(svg, state.h);

        // Draw sea level contour
        var seaLevelContour = contour(state.h, 0);
        drawPaths(svg, 'coast', seaLevelContour);

        updateStatus('Showing heightmap view');
    }

    function showTerrain() {
        if (!state.h) return;

        state.currentView = 'terrain';
        document.getElementById('cityvalue-controls').style.display = 'none';

        svg.selectAll('*').remove();

        // Draw land/sea
        var landSea = map(state.h, function(x) { return x > 0 ? 0.7 : 0.3; });
        visualizeVoronoi(svg, landSea, 0, 1);

        // Draw rivers and coasts
        var rivers = getRivers(state.h, 0.01);
        var coasts = contour(state.h, 0);
        drawPaths(svg, 'river', rivers);
        drawPaths(svg, 'coast', coasts);

        // Draw slopes
        visualizeSlopes(svg, {h: state.h});

        updateStatus('Showing terrain view');
    }

    function showCityValue() {
        if (!state.h) {
            updateStatus('Please generate a map first!');
            return;
        }

        state.currentView = 'cityvalue';
        document.getElementById('cityvalue-controls').style.display = 'block';

        updateCityValueView();
    }

    function updateCityValueView() {
        if (!state.h || state.currentView !== 'cityvalue') return;

        var n = parseInt(document.getElementById('cityvalue-n').value);
        document.getElementById('cityvalue-n-val').textContent = n;

        svg.selectAll('*').remove();

        // Calculate city scores progressively
        var tempCities = [];
        for (var i = 0; i < n; i++) {
            var score = cityScore(state.h, tempCities);
            var newcity = d3.scan(score, d3.descending);
            if (newcity !== undefined) {
                tempCities.push(newcity);
            }
        }

        // Show the final city score after N cities
        var finalScore = cityScore(state.h, tempCities);
        visualizeVoronoi(svg, finalScore);

        // Draw sea level contour
        var seaLevelContour = contour(state.h, 0);
        drawPaths(svg, 'coast', seaLevelContour);

        updateStatus('Showing city value after ' + n + ' cities');
    }

    function updateSeaLevel() {
        var seaLevel = parseFloat(document.getElementById('sea-level').value);
        document.getElementById('sea-val').textContent = seaLevel;

        if (!state.hBeforeSeaLevel || !state.mesh) return;

        // Use the stored pre-sea-level heights
        var h = state.hBeforeSeaLevel.slice();
        h.mesh = state.mesh;

        // Apply new sea level
        h = setSeaLevel(h, seaLevel);
        h = fillSinks(h);

        state.h = h;
        state.render.h = h;

        refreshCurrentView();
    }

    function refreshCurrentView() {
        if (!state.h) return;

        switch(state.currentView) {
            case 'heightmap':
                showHeightmap();
                break;
            case 'terrain':
                showTerrain();
                break;
            case 'cityvalue':
                updateCityValueView();
                break;
            default:
                showHeightmap();
        }
    }

    function previewCities() {
        if (!state.h) {
            updateStatus('Please generate a map first!');
            return;
        }

        updateStatus('Placing cities...');

        state.render.cities = [];
        state.render.params.ncities = parseInt(document.getElementById('ncities').value);
        state.render.params.nterrs = parseInt(document.getElementById('nterrs').value);

        placeCities(state.render);

        showTerrain();
        visualizeCities(svg, state.render);

        updateStatus('Cities placed! ' + state.render.cities.length + ' cities shown.');
    }

    function previewTerritories() {
        if (!state.h || !state.render.cities.length) {
            previewCities();
        }

        updateStatus('Calculating territories...');

        state.render.terr = getTerritories(state.render);

        // Visualize territories with colors
        svg.selectAll('*').remove();

        var terrColors = state.h.map(function(v, i) {
            if (state.render.terr[i] === undefined) return 0;
            var cityIdx = state.render.cities.indexOf(state.render.terr[i]);
            return (cityIdx + 1) / (state.render.params.nterrs + 1);
        });
        terrColors.mesh = state.h.mesh;

        visualizeVoronoi(svg, terrColors, 0, 1);

        var borders = getBorders(state.render);
        var coasts = contour(state.h, 0);
        drawPaths(svg, 'border', borders);
        drawPaths(svg, 'coast', coasts);

        visualizeCities(svg, state.render);

        updateStatus('Territories calculated!');
    }

    function drawFullMap() {
        if (!state.h) {
            updateStatus('Please generate a map first!');
            return;
        }

        updateStatus('Drawing complete map...');

        if (!state.render.cities.length) {
            state.render.params.ncities = parseInt(document.getElementById('ncities').value);
            state.render.params.nterrs = parseInt(document.getElementById('nterrs').value);
            placeCities(state.render);
        }

        svg.selectAll('*').remove();

        // Background
        var landSea = map(state.h, function(x) { return x > 0 ? 0.85 : 0.45; });
        visualizeVoronoi(svg, landSea, 0, 1);

        state.render.rivers = getRivers(state.h, 0.01);
        state.render.coasts = contour(state.h, 0);
        state.render.terr = getTerritories(state.render);
        state.render.borders = getBorders(state.render);

        drawPaths(svg, 'river', state.render.rivers);
        drawPaths(svg, 'coast', state.render.coasts);
        drawPaths(svg, 'border', state.render.borders);
        visualizeSlopes(svg, state.render);
        visualizeCities(svg, state.render);
        drawLabels(svg, state.render);

        updateStatus('Complete map drawn with cities, territories, and labels!');
    }

    // ============================================
    // PAINTING MODE
    // ============================================
    function setPaintMode(mode) {
        state.paintMode = mode;

        document.getElementById('btn-raise').classList.remove('active');
        document.getElementById('btn-lower').classList.remove('active');
        document.getElementById('btn-none').classList.remove('active');

        var modeText = document.getElementById('paint-mode-text');

        if (mode === 'raise') {
            document.getElementById('btn-raise').classList.add('active');
            modeText.textContent = 'Raise';
            modeText.className = 'mode-active';
        } else if (mode === 'lower') {
            document.getElementById('btn-lower').classList.add('active');
            modeText.textContent = 'Lower';
            modeText.className = 'mode-active';
        } else {
            document.getElementById('btn-none').classList.add('active');
            modeText.textContent = 'Off';
            modeText.className = 'mode-inactive';
        }
    }

    function paintTerrain(x, y) {
        if (!state.h || state.paintMode === 'none') return;

        var brushSize = parseFloat(document.getElementById('brush-size').value);
        var brushStrength = parseFloat(document.getElementById('brush-strength').value);
        var direction = state.paintMode === 'raise' ? 1 : -1;

        for (var i = 0; i < state.h.length; i++) {
            var vx = state.h.mesh.vxs[i];
            var dist = Math.sqrt((vx[0] - x) * (vx[0] - x) + (vx[1] - y) * (vx[1] - y));
            if (dist < brushSize) {
                var strength = (1 - dist / brushSize) * brushStrength;
                state.h[i] += direction * strength;
            }
        }

        state.h.downhill = null; // Clear cached downhill
        state.render.h = state.h;
        refreshCurrentView();
    }

    // Mouse event handlers for painting
    svg.on('mousedown', function() {
        if (state.paintMode !== 'none') {
            state.isPainting = true;
            var coords = d3.mouse(this);
            var x = coords[0] / 1000;
            var y = coords[1] / 1000;
            paintTerrain(x, y);
        }
    });

    svg.on('mousemove', function() {
        if (state.isPainting && state.paintMode !== 'none') {
            var coords = d3.mouse(this);
            var x = coords[0] / 1000;
            var y = coords[1] / 1000;
            paintTerrain(x, y);
        }
    });

    svg.on('mouseup', function() {
        if (state.isPainting) syncHBeforeSeaLevel();
        state.isPainting = false;
    });

    svg.on('mouseleave', function() {
        state.isPainting = false;
    });

    // ============================================
    // SVG EXPORT
    // ============================================
    function downloadSVG() {
        var svgElement = document.getElementById('map-svg');
        var svgData = new XMLSerializer().serializeToString(svgElement);

        // Add styles
        var styleString = `
            <style>
                path, line { fill: none; stroke: black; stroke-linecap: round; }
                .field { stroke: none; }
                .slope { stroke-width: 1; }
                .river { stroke-width: 2; }
                .coast { stroke-width: 4; }
                .border { stroke-width: 5; stroke-dasharray: 4,4; }
                text { font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif; stroke: white; stroke-width: 5; paint-order: stroke; }
                text.region { stroke-width: 10; font-variant: small-caps; }
            </style>
        `;

        svgData = svgData.replace('>', '>' + styleString);

        var blob = new Blob([svgData], {type: 'image/svg+xml'});
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'fantasy-map.svg';
        link.click();
        URL.revokeObjectURL(url);

        updateStatus('SVG downloaded!');
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    window.addEventListener('resize', resizeSVG);

    // Initialize
    resizeSVG();
    svg.attr('viewBox', '-500 -500 1000 1000');

    // Set default paint mode
    setPaintMode('none');
    </script>
</body>
</html>
